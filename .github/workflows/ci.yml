name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@wasm-tools
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: wasm-custom-section
      - run: just build
      - uses: actions/upload-artifact@v7
        with:
          name: component.wasm
          path: python-interpreter.wasm

  e2e:
    name: E2E Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: component.wasm
      - uses: actcore/act-cli/setup@main
      - uses: taiki-e/install-action@just
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: hurl
      - run: just test
