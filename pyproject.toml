[project]
name = "python-eval"
version = "0.2.0"
description = "Python interpreter"
requires-python = ">=3.14"
dependencies = [
    "act-sdk>=0.2.0",
    # Defense-in-depth pin; act-sdk also pins this. cbor2 6.0 is a Rust
    # C-extension that doesn't load inside componentize-py wasm.
    "cbor2>=5.9.0,<7",
]

[dependency-groups]
dev = [
    "componentize-py>=0.21.0",
    "ruff>=0.15.8",
]
