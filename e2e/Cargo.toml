[package]
name = "e2e-python-eval"
version = "0.1.0"
edition = "2024"
publish = false

# Detach from any outer workspace this component may sit in.
[workspace]

[dev-dependencies]
rmcp = { version = "3.5", features = ["client", "transport-child-process"] }
# `net` stays out of the scaffold's list: nothing here stubs a server — the
# component's one tool runs Python code and touches no network.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
serde_json = "1"
